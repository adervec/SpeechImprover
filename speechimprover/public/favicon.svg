<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="SpeechImprover">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c6cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#g)"/>
  <!-- rising voice/equalizer bars: audio + upward = "improver" -->
  <g fill="#fff">
    <rect x="4.5"  y="11.5" width="3" height="9"  rx="1.5"/>
    <rect x="9.5"  y="8.5"  width="3" height="15" rx="1.5"/>
    <rect x="14.5" y="10.5" width="3" height="11" rx="1.5"/>
    <rect x="19.5" y="6.5"  width="3" height="19" rx="1.5"/>
    <rect x="24.5" y="4.5"  width="3" height="23" rx="1.5"/>
  </g>
</svg>
