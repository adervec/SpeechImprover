<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- House standard 22: every app shares adervec.github.io, so lock down what this page may load.
         Scripts: this app, the house scripts, Google sign-in (Drive sync). Inline styles are React's style attributes.
         The dev server drops this tag (vite.config.js) because Vite injects an inline refresh script there. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://adervec.github.io https://accounts.google.com; style-src 'self' 'unsafe-inline' https://adervec.github.io https://accounts.google.com; img-src 'self' data: blob: https://*.googleusercontent.com; font-src 'self' https://adervec.github.io; connect-src 'self' https://adervec.github.io https://www.googleapis.com https://accounts.google.com https://oauth2.googleapis.com; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' https://accounts.google.com; manifest-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#7c6cff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Assess your English speech and practice targeted exercises to improve it." />
    <!-- Read by font.js as it runs, so they must come BEFORE it. -->
    <meta name="app-locales" content="%BASE_URL%locales/" />
    <meta name="app-whatsnew" content="%BASE_URL%whatsnew.json" />
    <!-- House font (Atkinson Hyperlegible + reader choice); sets --app-font. Not deferred. -->
    <script src="https://adervec.github.io/font.js"></script>
    <title>SpeechImprover — assess & improve your speaking</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://adervec.github.io/cowork.js" defer></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
